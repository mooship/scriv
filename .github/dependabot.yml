version: 2
updates:
  # One entry per ecosystem and directory: GitHub rejects the whole file otherwise, and Dependabot keeps using the last valid copy.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    groups:
      cargo-critical:
        patterns:
          - "aes-gcm"
          - "pbkdf2"
          - "rand"
          - "sha2"
          - "zeroize"
          - "rpassword"
      cargo:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "12:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
